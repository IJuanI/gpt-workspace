name: Publicar La Patota

on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: https://ijuani.github.io/gpt-workspace/
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Quitar dominio personalizado anterior
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pages = await github.rest.repos.getPages({ owner, repo });
            core.info(`Dominio antes de limpiar: ${pages.data.cname || '(ninguno)'}`);
            if (pages.data.cname) {
              await github.rest.repos.updateInformationAboutPagesSite({
                owner,
                repo,
                cname: '',
              });
            }
            const verified = await github.rest.repos.getPages({ owner, repo });
            core.info(`Dominio después de limpiar: ${verified.data.cname || '(ninguno)'}`);
            core.notice(`Pages API cname=${verified.data.cname || '(ninguno)'}; html_url=${verified.data.html_url}`);
            if (verified.data.cname) {
              throw new Error(`GitHub Pages aún conserva el dominio ${verified.data.cname}.`);
            }
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site
          cp index.html styles.css app.js game.js modes.js sound.js sw.js manifest.webmanifest icon.svg _site/
      - name: Empaquetar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar URL estándar de GitHub Pages
        shell: bash
        run: |
          set -u
          expected='https://ijuani.github.io/gpt-workspace/'
          probe="${expected}?cache_check=${GITHUB_RUN_ID}"
          result=''
          for attempt in 1 2 3 4 5 6; do
            result="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code} %{url_effective}' "$probe" || true)"
            status="${result%% *}"
            final_url="${result#* }"
            if [ "$status" = '200' ] && [ "$final_url" = "$probe" ]; then
              break
            fi
            sleep 10
          done
          printf 'status=%s\nfinal_url=%s\n' "$status" "$final_url" >> "$GITHUB_OUTPUT"
          printf '| URL de prueba | URL final | HTTP |\n| --- | --- | --- |\n| %s | %s | %s |\n' "$probe" "$final_url" "$status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != '200' ] || [ "$final_url" != "$probe" ]; then
            echo "::error title=Pages URL verification::Expected $probe, received HTTP $status at $final_url"
            echo "La URL estándar respondió HTTP $status y terminó en $final_url" >&2
            exit 1
          fi
