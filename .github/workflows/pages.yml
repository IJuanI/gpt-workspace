name: Publicar La Patota

on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Quitar dominio personalizado anterior
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pages = await github.rest.repos.getPages({ owner, repo });
            if (pages.data.cname) {
              await github.rest.repos.updateInformationAboutPagesSite({
                owner,
                repo,
                cname: null,
              });
              core.info(`Se quitó el dominio personalizado ${pages.data.cname}.`);
            } else {
              core.info('El sitio ya no tiene un dominio personalizado.');
            }
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site
          cp index.html styles.css app.js game.js modes.js sound.js sw.js manifest.webmanifest icon.svg _site/
      - name: Empaquetar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
