name: Publicar La Patota

on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read
  administration: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site
          cp index.html styles.css app.js game.js modes.js sound.js sw.js manifest.webmanifest icon.svg _site/
      - name: Empaquetar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
